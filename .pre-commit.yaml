# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: local
    hooks:
    -   id: argocd-generate
        name: Generate Argo CD Application manifests
        # Must run from src/go/ci so ../../../clusters resolves to the repo clusters dir.
        entry: sh -c 'cd src/go/ci && go run . argocd generate --clusters-dir ../../../clusters --repo-url "https://github.com/gregarendse/homelab.git" --target-revision master'
        language: system
        pass_filenames: false
        always_run: true
