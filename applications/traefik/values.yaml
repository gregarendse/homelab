# Traefik runs behind the OCI NLB. Publish the single public IP once here
# so ingress status contains a stable address that ExternalDNS can use for every ingress.
deployment:
  kind: DaemonSet

service:
  type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

providers:
  kubernetesIngress:
    publishedService:
      enabled: false

additionalArguments:
  - "--providers.kubernetesingress.ingressendpoint.ip=79.72.69.181"
