# Hermes Agent — provider configuration: Cloud provider
#
# Referenced from hermes.nix via:
#   data."config.yaml" = builtins.readFile ./config-cloud.yaml;
#
# Uncomment the provider block you want and set the matching API key in
# hermes-secrets.yaml (see hermes-secrets.example.yaml).

model:
  # ── OpenAI ──────────────────────────────────────────────────────────────────
  # Requires OPENAI_API_KEY in hermes-secrets.
  #  provider: openai
  #  model: gpt-4o

  # ── Gemini / Google AI ──────────────────────────────────────────────────────
  # Uncomment and comment-out the OpenAI block above.
  # Requires GEMINI_API_KEY in hermes-secrets.
  provider: google
  model: gemini-flash-latest
fallback_providers:
  - provider: google
    model: gemini-flash-lite-latest
  - provider: openai
    model: gpt-5.4-mini

gateway:
  enabled: true
api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8642

platforms:
  homeassistant:
    enabled: true

# Home Assistant MCP server:
# https://www.home-assistant.io/integrations/mcp_server/
#
# HASS_URL is set on the pod (hermes.nix). HASS_TOKEN comes from hermes-secrets.
# HA serves Streamable HTTP on POST /api/mcp only — a HEAD/GET preflight is not
# an MCP response, so skip it. The integration must be added in the HA UI or
# this endpoint 404s. See applications/hermes/README.md.
mcp_servers:
  homeassistant:
    url: "${HASS_URL}/api/mcp"
    headers:
      Authorization: "Bearer ${HASS_TOKEN}"
    skip_preflight: true
    timeout: 90
    connect_timeout: 30
