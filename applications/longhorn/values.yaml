# Single-node OCI cluster configuration for Longhorn
defaultSettings:
  defaultReplicaCount: 1
  # Reboot resilience (single-node cluster): automatically clear faulted lone
  # replicas and re-attach volumes after an unclean reboot.
  autoSalvage: true
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  # Set minimum available storage percentage reserve to 10% (default is 25%).
  storageMinimalAvailablePercentage: 10

persistence:
  # Make the default `longhorn` StorageClass provision 1 replica so volumes
  # don't sit permanently degraded on a single-node cluster.
  defaultClassReplicaCount: 1

# Backblaze B2 backup store configuration.
# NOTE: backupTarget is currently empty ("") to keep backups disabled until
# oversized Prometheus + Loki backup sets are cleared from B2 (10 GB free-tier cap).
# To re-enable:
#   1. Delete the oversized Prometheus + Loki backup sets from B2 so stored
#      data drops back under 10 GB.
#   2. Set backupTarget to "s3://<bucket-name>@<region>/"
#   3. Uncomment the extraObjects RecurringJobs below.
defaultBackupStore:
  backupTarget: ""
  backupTargetCredentialSecret: longhorn-backup-b2
  pollInterval: 0

# Staggered weekday backups (02:00 UTC) to stay under Backblaze B2's free-tier
# Class B/C daily transaction caps. Keep empty while backups are disabled.
extraObjects: []
