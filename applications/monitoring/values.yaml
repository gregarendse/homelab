prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 10GB
    storageSpec:
      volumeClaimTemplate:
        # Not backed up to B2: Prometheus TSDB is large and high-churn, and its
        # backups pushed total B2 storage past the free-tier 10 GB cap. Metrics
        # are reproducible, so we skip offsite backup (no source/group label).
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 15Gi

grafana:
  # Admin credentials are read from an externally-managed Secret rather than
  # being templated by the chart. This keeps the password out of Helm's
  # server-side-apply ownership (avoiding conflicts with manual edits) and out
  # of values.yaml/Git. Create the Secret out-of-band before deploying:
  #
  #   kubectl -n monitoring create secret generic grafana-admin-credentials \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password='<strong-password>'
  #
  # See applications/monitoring/README.md.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
    # Longhorn backup cycle: Saturday (staggered to spread B2 traffic)
    extraPvcLabels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/saturday-backup: enabled
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/tls-acme: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.arendse.nom.za
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.arendse.nom.za

  # client_id / client_secret are injected as env vars from this Secret and
  # auto-mapped by Grafana to [auth.generic_oauth] (GF_AUTH_GENERIC_OAUTH_*).
  # The Secret is created out-of-band — see applications/monitoring/README.md.
  envFromSecret: grafana-zitadel
  grafana.ini:
    server:
      root_url: https://grafana.arendse.nom.za

    users:
      # Keep local signup off; the OAuth policy below overrides this default role.
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer
    auth:
      # Keep local admin available; do not merge existing users by email.
      disable_login_form: false
      oauth_auto_login: false
      oauth_allow_insecure_email_lookup: false
    auth.generic_oauth:
      enabled: true
      name: Zitadel
      icon: signin
      scopes: openid profile email offline_access
      auth_url: https://homelab-jj4izt.eu1.zitadel.cloud/oauth/v2/authorize
      token_url: https://homelab-jj4izt.eu1.zitadel.cloud/oauth/v2/token
      api_url: https://homelab-jj4izt.eu1.zitadel.cloud/oidc/v1/userinfo
      use_pkce: true
      use_refresh_token: true
      # Credentials come only from grafana-zitadel via GF_AUTH_GENERIC_OAUTH_*.
      allow_sign_up: true
      # TEMPORARY: every successful Zitadel login receives organization Admin.
      # Replace with role-based mapping before adding users, enabling registration
      # or granting another org access. This is not server-wide GrafanaAdmin.
      role_attribute_path: "'Admin'"
      role_attribute_strict: false
      skip_org_role_sync: false
      allow_assign_grafana_admin: false

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100
      version: 1
      isDefault: false
