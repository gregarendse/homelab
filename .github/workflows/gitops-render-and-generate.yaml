name: gitops-render-and-generate

on:
  pull_request:
    branches: [master]

concurrency:
  group: gitops-render-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  render-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    if: "!contains(github.event.pull_request.title, '[skip gitops]')"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # action.yml pins docker://ghcr.io/gregarendse/ci:latest and cannot take an
      # expression. The runner's docker run does not pass --pull, so this local
      # tag is used instead of the published image, which lacks these flags and
      # does not write GITHUB_OUTPUT.
      - name: Build CI image for this PR
        run: docker build -t ghcr.io/gregarendse/ci:latest src/go/ci

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: List rendered kubenix apps
        id: list-rendered
        uses: ./.github/actions/ci-tool
        with:
          command: list-rendered
          repo-url: https://github.com/${{ github.repository }}.git

      - name: Render kubenix apps
        env:
          RENDERED_APPS: ${{ steps.list-rendered.outputs.stdout }}
        shell: bash
        run: |
          set -euo pipefail

          echo "$RENDERED_APPS" | while IFS=$'\t' read -r cluster app_name app_path; do
            [ -z "$cluster" ] && continue
            echo "Rendering $cluster/$app_name from $app_path"
            test -d "$app_path"

            # Build to ./result, then pretty-print it into result.json so the
            # committed rendered manifests are formatted and easy to review.
            rm -f "$app_path/result.json"
            (cd "$app_path" && nix build .#manifests && jq '.' ./result > result.json)
            mkdir -p "clusters/$cluster/rendered/$app_name"
            cp "$app_path/result.json" "clusters/$cluster/rendered/$app_name/result.json"
          done

      - name: Generate Argo CD ApplicationSets
        uses: ./.github/actions/ci-tool
        with:
          repo-url: https://github.com/${{ github.repository }}.git

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add clusters/*/rendered
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(gitops): update rendered manifests and appsets [skip gitops]"
          git push
