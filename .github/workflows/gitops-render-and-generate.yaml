name: gitops-render-and-generate

on:
  pull_request:
    branches: [master]

concurrency:
  group: gitops-render-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  render-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    if: "!contains(github.event.pull_request.title, '[skip gitops]')"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Ensure CI Docker image
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ci:latest"
          if ! docker pull "$CONTAINER_IMAGE"; then
            echo "Failed to pull $CONTAINER_IMAGE from GHCR, building locally..."
            docker build -t "$CONTAINER_IMAGE" src/go/ci
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Render kubenix apps
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER_IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ci:latest"

          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$CONTAINER_IMAGE" argocd list-rendered \
          | while IFS=$'\t' read -r cluster app_name app_path; do
            echo "Rendering $cluster/$app_name from $app_path"
            test -d "$app_path"

            # Build to ./result, then pretty-print it into result.json so the
            # committed rendered manifests are formatted and easy to review.
            rm -f "$app_path/result.json"
            (cd "$app_path" && nix build .#manifests && jq '.' ./result > result.json)
            mkdir -p "clusters/$cluster/rendered/$app_name"
            cp "$app_path/result.json" "clusters/$cluster/rendered/$app_name/result.json"
          done

      - name: Generate Argo CD ApplicationSets
        shell: bash
        run: |
          CONTAINER_IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ci:latest"

          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$CONTAINER_IMAGE" argocd generate \
            --repo-url "https://github.com/${{ github.repository }}.git" \
            --target-revision master

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add clusters/*/rendered
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(gitops): update rendered manifests and appsets [skip gitops]"
          git push
