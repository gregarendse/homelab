autoSync: true
apps:
  # In-repo "server" Helm chart releases (values live under applications/<app>/values.yaml)
  - name: echo
    type: helm
    namespace: echo
    helm:
      kind: path
      path: server
      releaseName: echo
      valueFiles:
        - applications/echo/values.yaml

  # External chart releases (leave as TODO until repo URLs/versions are confirmed)
  # Managed by infrastructure/kubernetes/argocd.tf
  #  - name: argocd
  #    type: helm
  #    namespace: argocd
  #    helm:
  #      kind: remote
  #      repoURL: https://argoproj.github.io/argo-helm
  #      chart: argo-cd
  #      targetRevision: "9.4.15"
  #      releaseName: argocd

  - name: cert-manager
    type: helm
    namespace: security
    helm:
      kind: remote
      repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.18.2
      releaseName: cert-manager
      valueFiles:
        - applications/cert-manager/values.yaml

  ## Ignore : ToDo: enroll
  #  - name: cilium
  #    type: helm
  #    namespace: kube-system
  #    helm:
  #      kind: remote
  #      repoURL: ""        # TODO
  #      chart: ""          # TODO
  #      targetRevision: "" # TODO
  #      releaseName: cilium

  - name: external-dns
    type: helm
    namespace: external-dns
    helm:
      kind: remote
      repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: 1.15.1
      releaseName: external-dns
      valueFiles:
        - applications/external-dns/values.yaml

  - name: longhorn
    type: helm
    namespace: longhorn-system
    helm:
      kind: remote
      repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.10.0
      releaseName: longhorn
      valueFiles:
        - applications/longhorn/values.yaml

  - name: traefik
    type: helm
    namespace: traefik
    helm:
      kind: remote
      repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 37.1.2
      releaseName: traefik
      valueFiles:
        - applications/traefik/values.yaml

  - name: vertical-pod-autoscaler
    type: helm
    namespace: kube-system
    helm:
      kind: remote
      repoURL: https://stevehipwell.github.io/helm-charts
      chart: vertical-pod-autoscaler
      targetRevision: 1.9.2
      releaseName: vertical-pod-autoscaler

  # Rendered (kubenix/Nix) apps -> CI renders to dist/oci/<app> and Argo applies YAML from there
  - name: hermes
    type: rendered
    path: applications/hermes

  - name: home-assistant
    type: rendered
    path: applications/home-assistant

  - name: pihole
    type: rendered
    path: applications/pihole

  - name: mongo
    type: rendered
    path: applications/mongo

  - name: unifi
    type: rendered
    path: applications/unifi

  - name: monitoring
    type: helm
    namespace: monitoring
    helm:
      kind: remote
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "69.0.0"
      releaseName: monitoring
      valueFiles:
        - applications/monitoring/values.yaml

  - name: mktxp
    type: rendered
    namespace: monitoring
    path: applications/mktxp

  - name: loki
    type: helm
    namespace: loki
    helm:
      kind: remote
      repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "6.27.0"
      releaseName: loki
      valueFiles:
        - applications/loki/values.yaml

